<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llamada de seguimiento postoperatorio</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:1.5rem auto;padding:0 1rem;background:#f7f8fa;color:#1c2330}
  h1{font-size:1.25rem} .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}
  select,button{font-size:1rem;padding:.5rem .8rem;border-radius:8px;border:1px solid #c8cdd6;background:#fff}
  button{cursor:pointer} button.primary{background:#0b57d0;color:#fff;border:none}
  button:disabled{opacity:.45;cursor:default}
  #status{font-weight:600} .pill{padding:.15rem .6rem;border-radius:99px;font-size:.85rem;font-weight:700}
  .verde{background:#d6f2dd;color:#0a6b2d}.amarillo{background:#fdf0c7;color:#8a6400}.rojo{background:#fbd9d3;color:#a1160a}
  #log{background:#fff;border:1px solid #e2e5ea;border-radius:10px;padding:1rem;min-height:280px;max-height:52vh;overflow-y:auto}
  .turn{margin:.5rem 0;line-height:1.35}.who{font-weight:700;font-size:.8rem;color:#5a6472}
  .agent .bubble{background:#eef3fe;border-radius:10px;padding:.5rem .7rem;display:inline-block}
  .patient .bubble{background:#eefbf1;border-radius:10px;padding:.5rem .7rem;display:inline-block}
  #summary{white-space:pre-wrap;background:#fff;border:1px solid #e2e5ea;border-radius:10px;padding:1rem;display:none;font-size:.9rem}
  a{color:#0b57d0}
</style>
</head>
<body>
<h1>📞 Llamada de seguimiento postoperatorio <a href="/admin" style="float:right;font-size:.85rem">consola de conocimiento →</a></h1>
<div class="row">
  <select id="patient"></select>
  <label>Día postop: <select id="day"><option>1</option><option selected>3</option><option>7</option><option>14</option></select></label>
  <button id="btnStart" class="primary">Iniciar llamada</button>
  <button id="btnEnd" disabled>Colgar</button>
  <span id="status">listo</span>
  <span id="triaje" class="pill verde" style="display:none">verde</span>
</div>
<div id="log"></div>
<h3 style="display:none" id="sumtitle">Resumen de la llamada</h3>
<div id="summary"></div>

<script>
let ws, ac, mic, workletNode, playCtx, playQueue = [], playing = false, srOut = 24000;
let ending = false;
const $ = id => document.getElementById(id);

async function loadPatients(){
  const ps = await (await fetch('/api/patients')).json();
  $('patient').innerHTML = ps.map(p =>
    `<option value='${encodeURIComponent(JSON.stringify(p))}'>${p.nombre} — ${p.procedimiento} (${p.edad} años)</option>`).join('');
}
loadPatients();

function log(who, text){
  const cls = who === 'Clara' ? 'agent' : 'patient';
  // nodos con textContent: el texto viene del LLM/ASR y del Excel de pacientes
  const turn = document.createElement('div'); turn.className = `turn ${cls}`;
  const w = document.createElement('div'); w.className = 'who'; w.textContent = who;
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  turn.append(w, b);
  $('log').appendChild(turn);
  $('log').scrollTop = $('log').scrollHeight;
}

// El worklet NO remuestrea: solo empaqueta el audio tal cual sale del
// micrófono. El servidor lo baja a 16 kHz con un filtro anti-aliasing real;
// hacerlo aquí, quitando muestras, destruía las consonantes (f, s, ch) y el
// reconocedor confundía «fiebre» con «nombre».
const WORKLET = `
class Cap extends AudioWorkletProcessor{
  constructor(){super(); this.buf=[];}
  process(inputs){
    const ch = inputs[0][0]; if(!ch) return true;
    for(let i=0;i<ch.length;i++) this.buf.push(ch[i]);
    if(this.buf.length>=2048){ this.port.postMessage(new Float32Array(this.buf)); this.buf=[]; }
    return true;
  }
}
registerProcessor('cap', Cap);`;

let playGen = 0, curSrc = null;

function stopPlayback(){
  playGen++;                       // invalida el drain en curso
  playQueue = [];
  if(curSrc){ try{ curSrc.stop(); }catch(e){} curSrc = null; }
  playing = false;
}

function playPCM(int16, sr){
  playQueue.push({int16, sr});
  if(!playing) drain();
}
async function drain(){
  const gen = ++playGen;           // token de generación de este drain
  playing = true;
  while(playQueue.length && gen === playGen){
    const {int16, sr} = playQueue.shift();
    if(!playCtx || playCtx.state === 'closed') playCtx = new AudioContext({sampleRate: sr});
    const f32 = Float32Array.from(int16, v => v/32768);
    const buf = playCtx.createBuffer(1, f32.length, sr);
    buf.copyToChannel(f32, 0);
    const src = playCtx.createBufferSource();
    src.buffer = buf; src.connect(playCtx.destination);
    curSrc = src;
    await new Promise(res => { src.onended = res; src.start(); });
    curSrc = null;
  }
  if(gen === playGen){
    playing = false;
    // avisa al servidor: solo AHORA empieza a correr el reloj de silencio,
    // para no interrumpir al paciente mientras Clara todavía hablaba
    if(ws && ws.readyState === 1) ws.send(JSON.stringify({type:'playback_done'}));
  }
}

$('btnStart').onclick = async () => {
  ending = false;
  $('btnStart').disabled = true;
  $('status').style.color = '';
  $('log').replaceChildren();
  $('summary').replaceChildren();
  $('summary').style.display = 'none';
  $('sumtitle').style.display = 'none';
  $('triaje').style.display = 'none';
  const p = JSON.parse(decodeURIComponent($('patient').value));
  p.dia_postop = parseInt($('day').value);
  const socket = new WebSocket(`ws://${location.host}/ws/call`);
  ws = socket;
  socket.binaryType = 'arraybuffer';
  socket.onopen = async () => {
    if(ws !== socket) return;
    try {
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error('Este navegador no expone el micrófono. Abra la página en '
          + 'http://localhost:8000 (no por dirección IP): el micrófono solo se '
          + 'permite en orígenes seguros.');
      }
      mic = await navigator.mediaDevices.getUserMedia({audio:{
        echoCancellation:true, noiseSuppression:true, autoGainControl:true,
        channelCount:1}});
      ac = new AudioContext();   // frecuencia nativa: sin conversiones ocultas
      // el servidor necesita saber a qué frecuencia viene el audio
      socket.send(JSON.stringify({type:'start', patient:p, sample_rate: ac.sampleRate}));
      await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET],{type:'text/javascript'})));
      const srcNode = ac.createMediaStreamSource(mic);
      workletNode = new AudioWorkletNode(ac,'cap');
      workletNode.port.onmessage = e => {
        if(ws === socket && socket.readyState===1) socket.send(e.data.buffer);
      };
      srcNode.connect(workletNode);
      // Mantener el grafo Web Audio "tirando" del worklet. El procesador no
      // escribe salida, así que al destino llegan ceros y no se oye el micrófono.
      workletNode.connect(ac.destination);
      console.log('[audio] micrófono a', ac.sampleRate, 'Hz →  servidor remuestrea a 16 kHz');
      if(ac.state === 'suspended') await ac.resume();
      $('status').textContent = 'en llamada — hable con naturalidad';
      $('btnStart').disabled = true; $('btnEnd').disabled = false;
      $('triaje').style.display='inline-block';
    } catch (err) {
      // sin esto, un fallo de micrófono dejaba la página muda y sin explicación
      const msg = (err && err.name === 'NotAllowedError')
        ? 'Permiso de micrófono denegado. Haga clic en el candado de la barra de '
          + 'direcciones → Micrófono → Permitir, y recargue.'
        : (err && err.name === 'NotFoundError')
        ? 'No se detectó ningún micrófono conectado.'
        : (err && err.message) || String(err);
      $('status').textContent = '⚠ ' + msg;
      $('status').style.color = '#a1160a';
      log('Sistema', 'No se pudo iniciar la llamada: ' + msg);
      endCall(true);
    }
  };
  socket.onerror = () => {
    if(ws !== socket) return;
    $('status').textContent = '⚠ No hay conexión con el servidor (¿está corriendo scripts/run.sh?)';
    $('status').style.color = '#a1160a';
  };
  socket.onmessage = ev => {
    if(ws !== socket) return;
    if(typeof ev.data === 'string'){
      const m = JSON.parse(ev.data);
      if(m.type==='audio_start'){ srOut = m.sr; }
      else if(m.type==='transcript'){ log('Usted', m.text); $('status').textContent='Clara está respondiendo…'; }
      else if(m.type==='transcript_fix'){
        const bs = document.querySelectorAll('.patient .bubble');
        if(bs.length) bs[bs.length-1].textContent = m.text;
      }
      else if(m.type==='agent_text'){ log('Clara', m.text);
        $('triaje').className = 'pill ' + m.triaje; $('triaje').textContent = m.triaje + (m.alerta ? ' · ALERTA' : ''); }
      else if(m.type==='turn_end'){ $('status').textContent='en llamada — hable con naturalidad'; }
      else if(m.type==='user_speech_start'){ stopPlayback(); }
      else if(m.type==='error'){
        $('status').textContent='⚠ Error al procesar la voz: ' + m.detail;
        $('status').style.color='#a1160a';
      }
      else if(m.type==='call_summary'){
        $('sumtitle').style.display='block'; $('summary').style.display='block';
        $('summary').textContent = JSON.stringify(m.summary, null, 2);
      }
    } else {
      playPCM(new Int16Array(ev.data), srOut);
    }
  };
  // Un socket viejo puede cerrar DESPUÉS de iniciar otra llamada. Nunca debe
  // apagar el micrófono ni el AudioContext de la sesión nueva.
  socket.onclose = () => { if(ws === socket) endCall(false); };
};

function endCall(sendEnd = true){
  const socket = ws;
  if(sendEnd && !ending && socket && socket.readyState===1){
    socket.send(JSON.stringify({type:'end'}));
    // No dejar la interfaz esperando el resumen/LLM para terminar la llamada.
    setTimeout(() => {
      if(socket.readyState===0 || socket.readyState===1) socket.close(1000, 'usuario colgó');
    }, 250);
  }
  ending = true;
  stopPlayback();
  if(mic){ mic.getTracks().forEach(t=>t.stop()); mic = null; }
  if(workletNode){ try{ workletNode.disconnect(); }catch(e){} workletNode = null; }
  if(ac){ ac.close().catch(()=>{}); ac = null; }
  if(playCtx){ playCtx.close().catch(()=>{}); playCtx = null; }
  ws = null;
  $('btnStart').disabled=false; $('btnEnd').disabled=true;
  $('status').textContent='llamada finalizada';
}
$('btnEnd').onclick = () => endCall(true);
</script>
</body>
</html>
